spring:
  application:
    name: colaborador
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/colaborador_test}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true